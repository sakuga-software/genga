version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The packages support Node 22.12 and later. Newer types let code use APIs that Node 22 does not have.
      # Update this major together with the `engines` field.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      tiptap:
        patterns: ['@tiptap/*']
      react-router:
        patterns: ['react-router', '@react-router/*']
      heroui:
        patterns: ['@heroui/*', 'react-aria', 'react-aria-components', '@react-aria/*', '@internationalized/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
