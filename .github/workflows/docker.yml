name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - apps/server/**
      - packages/genga/**
      - pnpm-lock.yaml
      - .dockerignore
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build the image (pull request, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One platform and no buildx builder: the runner has a rootless Docker without QEMU.
      - name: Build
        run: docker build -f apps/server/Dockerfile -t "genga:pr-${{ github.run_id }}" .
      - name: The image refuses to start without settings
        run: |
          set +e
          output="$(docker run --rm "genga:pr-${{ github.run_id }}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q 'DATABASE_URL is required'
      # The server build bundles genga: genga.handle finds the admin app through genga/package.json.
      - name: The image ships the admin app where the server build finds it
        run: |
          docker run --rm --entrypoint /usr/local/bin/node "genga:pr-${{ github.run_id }}" --input-type=module -e "
            import { createRequire } from 'node:module';
            import { readFileSync } from 'node:fs';
            import path from 'node:path';
            const pkg = createRequire('/app/build/server/index.js').resolve('genga/package.json');
            const dir = path.join(path.dirname(pkg), 'dist/admin-app');
            const manifest = JSON.parse(readFileSync(path.join(dir, 'genga-admin.json'), 'utf8'));
            for (const name of [manifest.script, manifest.style]) readFileSync(path.join(dir, name));
            console.log('admin app:', dir, manifest.script, manifest.style);
          "
      - name: Remove the image
        if: always()
        run: docker image rm -f "genga:pr-${{ github.run_id }}" || true

  publish:
    name: Build and push to GHCR (amd64, arm64)
    # GitHub-hosted: QEMU for arm64, and the GHCR token of the workflow. Hosted minutes are
    # free for a public repository only, so the job waits until the repository is public.
    if: github.event_name == 'push' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./packages/genga/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the package version $version."
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/genga
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Genga
            org.opencontainers.image.description=Genga headless CMS: admin, public JSON API and live preview for any site.
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
