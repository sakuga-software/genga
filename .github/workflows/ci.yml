name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub-hosted runners: free for a public repository, and a pull request from a fork runs on a
# fresh machine of GitHub, never on our own machines. See CONTRIBUTING.md.

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      # The example reads the types of the built package.
      - run: pnpm build
      - run: pnpm typecheck

  test:
    # The React Router 8 leg keeps the name of the required check of the ruleset.
    name: ${{ matrix.react-router == '8' && 'Tests (Postgres) and packed tarball' || format('Packed tarball (React Router {0})', matrix.react-router) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        react-router: ['8', '7']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genga
          POSTGRES_PASSWORD: genga
          POSTGRES_DB: genga
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U genga"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      # S3-compatible storage for the tests of the S3 adapter. This image starts MinIO without a command.
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: genga
          MINIO_ROOT_PASSWORD: genga-minio-test
        ports:
          - 9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Point the tests at the Postgres and MinIO services
        run: |
          base="postgres://genga:genga@localhost:${{ job.services.postgres.ports['5432'] }}"
          echo "GENGA_TEST_ADMIN_URL=$base/genga" >> "$GITHUB_ENV"
          echo "GENGA_TEST_DATABASE_URL=$base/genga_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$base/genga" >> "$GITHUB_ENV"
          echo "GENGA_TEST_S3_ENDPOINT=http://localhost:${{ job.services.minio.ports['9000'] }}" >> "$GITHUB_ENV"
          echo "GENGA_TEST_S3_ACCESS_KEY=genga" >> "$GITHUB_ENV"
          echo "GENGA_TEST_S3_SECRET_KEY=genga-minio-test" >> "$GITHUB_ENV"
      - if: matrix.react-router == '8'
        run: pnpm test
      - run: pnpm test:pack --react-router=${{ matrix.react-router }}

  e2e-next:
    name: End-to-end, Next.js example (remote mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genga
          POSTGRES_PASSWORD: genga
          POSTGRES_DB: genga_e2e
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U genga"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The WebKit test proves the Partitioned cookies on macOS only. On Linux, WebKit keeps no
      # cookie of a frame on another site, and the test is an expected failure.
      - run: pnpm --filter genga-example-next exec playwright install --with-deps chromium webkit
      - name: Run the example against the Genga server
        run: |
          export E2E_DATABASE_URL="postgres://genga:genga@localhost:${{ job.services.postgres.ports['5432'] }}/genga_e2e"
          pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-next-report
          path: |
            examples/next/playwright-report
            examples/next/test-results
          retention-days: 7

  e2e-admin:
    name: End-to-end, prebuilt admin (React Router example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genga
          POSTGRES_PASSWORD: genga
          POSTGRES_DB: genga_e2e
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U genga"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter genga build
      - run: pnpm --filter genga-example-react-router exec playwright install --with-deps chromium
      - name: Run the admin tests against the example
        run: |
          export E2E_DATABASE_URL="postgres://genga:genga@localhost:${{ job.services.postgres.ports['5432'] }}/genga_e2e"
          pnpm test:e2e:admin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-admin-report
          path: |
            examples/react-router/playwright-report
            examples/react-router/test-results
          retention-days: 7
