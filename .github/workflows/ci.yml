name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub-hosted runners: free for a public repository, and a pull request from a fork runs on a
# fresh machine of GitHub, never on our own machines. See CONTRIBUTING.md.

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      # The example reads the types of the built package.
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Tests (Postgres) and packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genga
          POSTGRES_PASSWORD: genga
          POSTGRES_DB: genga
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U genga"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm installer needs Node: set up Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Point the tests at the Postgres service
        run: |
          base="postgres://genga:genga@localhost:${{ job.services.postgres.ports['5432'] }}"
          echo "GENGA_TEST_ADMIN_URL=$base/genga" >> "$GITHUB_ENV"
          echo "GENGA_TEST_DATABASE_URL=$base/genga_test" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$base/genga" >> "$GITHUB_ENV"
      - run: pnpm test
      - run: pnpm test:pack
